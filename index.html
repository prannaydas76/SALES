    body { background-color: #f3f6f9; color: #181818; }
    .sf-scroll::-webkit-scrollbar { height: 7px; width: 6px; }
    .sf-scroll::-webkit-scrollbar-track { background: #eef2f6; border-radius: 9999px; }

    .sf-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

      to { transform: translateY(0); opacity: 1; }

    .sf-tab-active {

      border-bottom: 3px solid #0176d3;

    }

        <button type="button" id="mobileMenuBtn" class="md:hidden p-1.5 rounded-lg text-sky-200 hover:bg-white/10" aria-label="Menu">
          <i data-lucide="menu" class="w-5 h-5"></i>

        <input id="globalSearch" type="search" placeholder="Search opportunities, developers, contacts, visits..." class="w-full pl-9 pr-3 py-1.5 text-sm rounded-lg bg-white/15 text-white placeholder-sky-200/80 border border-white/15 focus:bg-white focus:text-slate-900 focus:placeholder-slate-400 focus:outline-none transition-colors" />

      <!-- Quick Actions -->

        </button>
        <button type="button" id="quickFixVisitBtn" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white text-xs font-medium border border-white/15 transition-colors">

        <button type="button" id="quickNewDealBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#0176d3] hover:bg-[#0161b0] text-white text-xs font-semibold shadow-sm transition-colors">

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.deals) && Array.isArray(parsed.activities)) return parsed;
        }
      } catch (e) {}
      return deepClone(INITIAL_DATA);
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); } catch (e) {}
    }

    function esc(str) {
      if (str === null || str === undefined) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function fmtINR(amount, compact = true) {
      const n = Number(amount) || 0;
      if (n === 0) return '₹0';
      if (compact) {
        if (Math.abs(n) >= 1e7) return '₹' + (n / 1e7).toFixed(2) + ' Cr';
        if (Math.abs(n) >= 1e5) return '₹' + (n / 1e5).toFixed(2) + ' L';
      }
      return '₹' + Math.round(n).toLocaleString('en-IN');
    }

    function fmtDealAmount(d) {
      if (d.currency === 'USD' && d.displayValue) return d.displayValue;
      if (d.amount && d.amount > 0) return fmtINR(d.amount, true);
      if (d.displayValue) return d.displayValue;
      return 'TBD';
    }

    function getStageMeta(k) { return STAGES.find(s => s.key === k) || STAGES[2]; }
    function getVisitTypeMeta(k) { return VISIT_TYPES.find(v => v.key === k) || VISIT_TYPES[0]; }

    function showToast(msg, tone = 'blue') {
      const el = document.createElement('div');
      const map = { blue: 'bg-[#032d60] text-white', emerald: 'bg-emerald-700 text-white', rose: 'bg-rose-700 text-white' };
      el.className = `toast-enter pointer-events-auto px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2 ${map[tone] || map.blue}`;
      el.textContent = msg;
      document.getElementById('toastContainer').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.2s'; setTimeout(() => el.remove(), 220); }, 2500);
    }

    function copyText(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text, 'emerald')).catch(() => fallbackCopy(text));
      } else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
        showToast('Copied: ' + text, 'emerald');
      } catch (e) { showToast('Copy unavailable', 'rose'); }
    }

    function closeModal() {

                            <div class="text-sm font-bold ${v.done ? 'line-through text-slate-400' : 'text-slate-900'}">${esc(v.client || 'Client Visit')}</div>
                            <div class="text-xs text-slate-500">${esc(v.timeSlot || 'TBD')} · ${esc(v.projectInfo || v.locationType || 'Location TBD')}</div>
                          </div>
                        </div>
                        <button type="button" data-edit-visit="${esc(v.id)}" class="text-xs font-semibold text-[#0176d3] hover:underline shrink-0">Edit</button>
                      </div>
                      <div class="flex flex-wrap gap-1.5 pt-1">
                        <span class="text-[10px] px-2 py-0.5 rounded-full border font-medium ${vt.color}">${esc(v.visitType)}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 font-medium">${esc(v.visitStatus || 'Planned')}</span>
                      </div>
                      ${v.agenda ? `<div class="text-xs text-slate-700"><span class="font-semibold">Agenda:</span> ${esc(v.agenda)}</div>` : ''}
                      ${v.remarks ? `<div class="text-xs text-slate-500 bg-slate-50 rounded-lg p-2">${esc(v.remarks)}</div>` : ''}
                    </div>
                  `;
                }).join('') : `
                  <div class="text-center py-8 border border-dashed border-slate-200 rounded-xl space-y-2">
                    <div class="text-xs text-slate-500">No visits planned for ${esc(state.calSelectedDate)}</div>
                    <button type="button" id="emptyDayFixBtn" class="text-xs font-semibold text-[#0176d3] hover:underline">+ Fix a client visit</button>
                  </div>
                `}
              </div>
            </div>
          </div>
        ` : `
          <!-- Agenda List View -->
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase">
                    <th class="py-3 px-4">Done</th>
                    <th class="py-3 px-4">Date &amp; Time</th>
                    <th class="py-3 px-4">Client &amp; Project</th>
                    <th class="py-3 px-4">Visit Type</th>
                    <th class="py-3 px-4">Status</th>
                    <th class="py-3 px-4">Agenda / Remarks</th>
                    <th class="py-3 px-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${sortedAgenda.map(v => {
                    const vt = getVisitTypeMeta(v.visitType);
                    return `
                      <tr class="hover:bg-sky-50/30">
                        <td class="py-3 px-4"><input type="checkbox" data-toggle-visit="${esc(v.id)}" ${v.done ? 'checked' : ''} class="rounded border-slate-300 text-[#0176d3] cursor-pointer" /></td>
                        <td class="py-3 px-4 whitespace-nowrap">
                          <div class="text-xs font-bold text-slate-900">${esc(v.date)}</div>
                          <div class="text-[11px] text-slate-400">${esc(v.day)} · ${esc(v.timeSlot || '11:00')}</div>
                        </td>
                        <td class="py-3 px-4 min-w-[180px]">

      // Bind calendar controls
      container.querySelector('#calPrevBtn').addEventListener('click', () => {
        state.calMonth--;
        if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }

      });
      container.querySelector('#calNextBtn').addEventListener('click', () => {
        state.calMonth++;
        if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
        render();
      });
      container.querySelector('#calTodayBtn').addEventListener('click', () => {
        state.calYear = 2026; state.calMonth = 10; state.calSelectedDate = TODAY_STR; render();
      });
      container.querySelector('#calStatusFilter').addEventListener('change', e => { state.calStatusFilter = e.target.value; render(); });
      container.querySelectorAll('.calmode-btn').forEach(b => b.addEventListener('click', () => { state.calMode = b.dataset.calmode; render(); }));
      container.querySelector('#calNewVisitBtn').addEventListener('click', () => openVisitModal(null, { date: state.calSelectedDate }));

      if (state.calMode === 'month') {
        container.querySelectorAll('.cal-day-cell').forEach(cell => {
          cell.addEventListener('click', () => { state.calSelectedDate = cell.dataset.calDay; render(); });
        });
        container.querySelectorAll('[data-quick-add-day]').forEach(btn => {
          btn.addEventListener('click', e => { e.stopPropagation(); state.calSelectedDate = btn.dataset.quickAddDay; openVisitModal(null, { date: btn.dataset.quickAddDay }); });
        });
        container.querySelector('#addOnSelectedDayBtn').addEventListener('click', () => openVisitModal(null, { date: state.calSelectedDate }));
        const emptyBtn = container.querySelector('#emptyDayFixBtn');
        if (emptyBtn) emptyBtn.addEventListener('click', () => openVisitModal(null, { date: state.calSelectedDate }));
      }
      container.querySelectorAll('[data-edit-visit]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openVisitModal(b.dataset.editVisit); }));
      container.querySelectorAll('[data-toggle-visit]').forEach(cb => cb.addEventListener('change', () => toggleVisitDone(cb.dataset.toggleVisit)));

    function openVisitModal(visitId = null, prefill = {}) {
      const existing = visitId ? state.data.activities.find(a => a.id === visitId) : null;
      const v = existing || {
        id: 'ACT-' + String(Date.now()).slice(-5),
        date: prefill.date || state.calSelectedDate || '2026-11-23',
        timeSlot: prefill.timeSlot || '11:00',
        visitType: prefill.visitType || 'Site / Client Visit',
        visitStatus: 'Planned',
        locationType: 'Site / HO',
        client: prefill.client || '',
        projectInfo: prefill.projectInfo || '',
        agenda: prefill.agenda || '',
        remarks: prefill.remarks || '',
        nextPoa: '',
        done: false
      };

      const clientSuggestions = [...new Set([
        ...state.data.deals.map(d => d.client),
        ...state.data.developers.map(d => d.name),
        ...state.data.priorityAccounts.map(p => p.company)
      ].filter(Boolean))].sort();

      openModal('Visit Planner · Calendar', existing ? `Edit Visit — ${v.client || v.date}` : 'Pre-Plan & Fix Client Visit', `
        <form id="visitForm" class="space-y-4">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Visit Date *</label>
              <input name="date" type="date" required value="${esc(v.date)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Time Slot</label>
              <input name="timeSlot" type="time" value="${esc(v.timeSlot || '11:00')}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Visit Status</label>
              <select name="visitStatus" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]">
                ${['Planned','Confirmed','Rescheduled','Completed'].map(st => `<option value="${st}" ${(v.visitStatus || 'Planned') === st ? 'selected' : ''}>${st}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Client / Developer *</label>
              <input name="client" list="clientDatalist" required value="${esc(v.client)}" placeholder="Type or pick client..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" />
              <datalist id="clientDatalist">
                ${clientSuggestions.map(c => `<option value="${esc(c)}"></option>`).join('')}
              </datalist>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Visit Type</label>
              <select name="visitType" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]">
                ${VISIT_TYPES.map(vt => `<option value="${esc(vt.key)}" ${v.visitType === vt.key ? 'selected' : ''}>${esc(vt.key)}</option>`).join('')}
              </select>
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-semibold text-slate-700 mb-1">Location / Project Site</label>
              <input name="projectInfo" value="${esc(v.projectInfo)}" placeholder="e.g. Lodha HO Mahalaxmi, BKC, Navi Mumbai Airport..." class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Meeting Agenda / Purpose</label>
            <input name="agenda" value="${esc(v.agenda)}" placeholder="e.g. Mockup quotation review, GRC sample submission, BOQ discussion" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Remarks / Next Plan of Action (PoA)</label>
            <textarea name="remarks" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]">${esc(v.remarks)}</textarea>
          </div>

          <div class="pt-3 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              ${existing ? `<button type="button" id="deleteVisitBtn" class="px-3 py-2 rounded-lg text-xs font-semibold text-rose-600 hover:bg-rose-50">Delete</button>` : ''}
              ${existing ? `<button type="button" id="downloadSingleIcsBtn" class="inline-flex items-center gap-1 px-3 py-2 rounded-lg text-xs font-semibold bg-sky-50 text-[#0176d3] hover:bg-sky-100"><i data-lucide="calendar-arrow-down" class="w-3.5 h-3.5"></i>Export .ics (Outlook/Google)</button>` : ''}
            </div>
            <div class="flex gap-2">
              <button type="button" id="cancelVisitBtn" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
              <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-[#0176d3] hover:bg-[#0161b0] text-white shadow-sm">${existing ? 'Update Visit' : 'Fix Visit on Calendar'}</button>
            </div>
          </div>
        </form>
      `);

      document.getElementById('cancelVisitBtn').addEventListener('click', closeModal);
      if (existing) {
        document.getElementById('downloadSingleIcsBtn').addEventListener('click', () => {
          exportVisitsIcs([existing], `TGE_Visit_${(existing.client || 'Client').replace(/[^a-zA-Z0-9]/g, '_')}_${existing.date || 'plan'}.ics`);
        });
        document.getElementById('deleteVisitBtn').addEventListener('click', () => {
          state.data.activities = state.data.activities.filter(x => x.id !== existing.id);
          saveState(); closeModal(); showToast('Visit removed from calendar', 'rose'); render();
        });
      }
      document.getElementById('visitForm').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const dt = fd.get('date');
        const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const dayName = dt ? days[new Date(dt + 'T00:00:00').getDay()] : '';
        const vStatus = fd.get('visitStatus');
        const updated = {
          ...v,
          date: dt,
          day: dayName,
          timeSlot: fd.get('timeSlot'),
          visitType: fd.get('visitType'),
          visitStatus: vStatus,
          locationType: fd.get('visitType'),
          client: fd.get('client').trim(),
          projectInfo: fd.get('projectInfo').trim(),
          agenda: fd.get('agenda').trim(),
          remarks: fd.get('remarks').trim(),
          done: vStatus === 'Completed'

        if (existing) {

          showToast('Visit updated on calendar', 'emerald');
        } else {
          state.data.activities.push(updated);
          showToast(`Visit fixed for ${updated.client} on ${updated.date}`, 'emerald');
        }
        // Jump calendar to that date's month
        if (dt) {
          state.calSelectedDate = dt;
          state.calYear = parseInt(dt.slice(0, 4), 10);
          state.calMonth = parseInt(dt.slice(5, 7), 10) - 1;
        }
        saveState(); closeModal(); render();
      });
    }

    // ==================== 3. OPPORTUNITIES (DEALS PIPELINE) ====================
    function getFilteredDeals() {
      const q = state.search.trim().toLowerCase();
      return state.data.deals.filter(d => {
        if (state.dealFilters.source !== 'All' && d.source !== state.dealFilters.source) return false;
        if (state.dealFilters.stage !== 'All' && d.stage !== state.dealFilters.stage) return false;
        if (state.dealFilters.owner !== 'All' && d.owner !== state.dealFilters.owner) return false;
        if (q) {
          const hay = [d.client, d.project, d.contact, d.refNo, d.product, d.owner, d.remarks, d.followUp].join(' ').toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });
    }

    function renderDeals(container) {
      const filtered = getFilteredDeals();
      const totalVal = filtered.reduce((s, d) => s + (Number(d.amount) || 0), 0);
      const owners = [...new Set([...DEAL_OWNERS, ...state.data.deals.map(d => d.owner).filter(Boolean)])].sort();

              <option value="All">All Stages</option>
              ${STAGES.map(s => `<option value="${esc(s.key)}" ${state.dealFilters.stage === s.key ? 'selected' : ''}>${esc(s.label)}</option>`).join('')}

            <select id="filterDealOwner" class="text-xs font-semibold bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-2">
              <option value="All">All Owners</option>

            </select>

          </div>

          <div class="flex items-center gap-3">
            <span class="text-xs text-slate-600 font-medium">${filtered.length} opportunities · <span class="text-[#0176d3] font-bold">${fmtINR(totalVal)}</span></span>
            <div class="inline-flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
              <button type="button" data-layout="kanban" class="layout-btn px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 ${state.dealsLayout === 'kanban' ? 'bg-white text-[#0176d3] shadow-sm' : 'text-slate-600'}"><i data-lucide="columns-3" class="w-3.5 h-3.5"></i>Kanban</button>
              <button type="button" data-layout="table" class="layout-btn px-2.5 py-1 rounded-md text-xs font-semibold flex items-center gap-1 ${state.dealsLayout === 'table' ? 'bg-white text-[#0176d3] shadow-sm' : 'text-slate-600'}"><i data-lucide="table-2" class="w-3.5 h-3.5"></i>List</button>
            </div>
          </div>
        </div>

        ${state.dealsLayout === 'kanban' ? `
          <div class="sf-scroll flex gap-3.5 overflow-x-auto pb-4 items-start">
            ${STAGES.map(st => {
              const colDeals = filtered.filter(d => d.stage === st.key);
              const colSum = colDeals.reduce((s, d) => s + (Number(d.amount) || 0), 0);
              return `
                <div class="w-72 shrink-0 bg-slate-100/90 rounded-xl border border-slate-200 p-2.5 flex flex-col max-h-[72vh]">
                  <div class="px-1.5 pb-2 mb-2 border-b border-slate-200 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-1.5 min-w-0">
                      <span class="w-2.5 h-2.5 rounded-full ${st.dot} shrink-0"></span>
                      <span class="text-xs font-bold text-slate-800 truncate">${esc(st.label)}</span>
                      <span class="text-[10px] px-1.5 py-0.5 rounded-full bg-white border border-slate-200 text-slate-600 font-bold">${colDeals.length}</span>
                    </div>
                    <span class="text-xs font-bold text-[#0176d3] shrink-0">${fmtINR(colSum)}</span>
                  </div>
                  <div class="sf-scroll space-y-2 overflow-y-auto pr-0.5 flex-1">
                    ${colDeals.length ? colDeals.map(d => `
                      <div data-edit-deal="${esc(d.id)}" class="bg-white rounded-lg border border-slate-200 p-3 shadow-sm hover:border-[#0176d3] hover:shadow transition-all cursor-pointer space-y-2">
                        <div class="flex items-start justify-between gap-2">
                          <div class="font-bold text-sm text-slate-900 leading-snug">${esc(d.client)}</div>
                          <span class="text-xs font-bold text-[#0176d3] shrink-0">${esc(fmtDealAmount(d))}</span>
                        </div>
                        <div class="text-xs text-slate-600 line-clamp-2">${esc(d.project || 'Project TBD')}</div>
                        <div class="flex flex-wrap gap-1">
                          ${d.refNo ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-semibold">#${esc(d.refNo)}</span>` : ''}
                          ${d.product ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-sky-50 text-[#0176d3] font-semibold">${esc(d.product)}</span>` : ''}

                        <div class="pt-1.5 border-t border-slate-100 flex items-center justify-between gap-2">
                          <button type="button" data-plan-visit-deal="${esc(d.id)}" class="text-[11px] font-semibold text-[#0176d3] hover:underline flex items-center gap-1"><i data-lucide="calendar-plus" class="w-3 h-3"></i>Visit</button>

                            ${STAGES.map(opt => `<option value="${esc(opt.key)}" ${opt.key === d.stage ? 'selected' : ''}>${esc(opt.short)}</option>`).join('')}
                          </select>
                        </div>
                      </div>
                    `).join('') : '<div class="text-center py-6 text-xs text-slate-400 border border-dashed border-slate-300 rounded-lg">No opportunities</div>'}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        ` : `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse text-sm">
                <thead>

                      <td class="py-3 px-4 min-w-[200px]"><div class="font-semibold text-slate-900">${esc(d.client)}</div><div class="text-xs text-slate-500">${esc(d.project)}</div></td>
                      <td class="py-3 px-4 whitespace-nowrap"><span class="text-xs px-2 py-0.5 rounded-full bg-sky-50 text-[#0176d3] font-semibold">${esc(d.product || '—')}</span></td>

      container.querySelector('#filterDealStage').addEventListener('change', e => { state.dealFilters.stage = e.target.value; render(); });
      container.querySelector('#filterDealOwner').addEventListener('change', e => { state.dealFilters.owner = e.target.value; render(); });
      const clr = container.querySelector('#clearDealFilters');
      if (clr) clr.addEventListener('click', () => { state.dealFilters = { source: 'All', stage: 'All', owner: 'All' }; state.search = ''; document.getElementById('globalSearch').value = ''; render(); });
      container.querySelectorAll('.layout-btn').forEach(b => b.addEventListener('click', () => { state.dealsLayout = b.dataset.layout; render(); }));
      container.querySelectorAll('[data-edit-deal]').forEach(el => el.addEventListener('click', () => openDealModal(el.dataset.editDeal)));
      container.querySelectorAll('[data-plan-visit-deal]').forEach(b => b.addEventListener('click', e => {
        e.stopPropagation();
        const d = state.data.deals.find(x => x.id === b.dataset.planVisitDeal);
        if (d) openVisitModal(null, { client: d.client, projectInfo: d.project, agenda: `Follow-up on ${d.product || 'Proposal'} (${fmtDealAmount(d)})` });
      }));
      container.querySelectorAll('[data-move-stage]').forEach(sel => {
        sel.addEventListener('click', e => e.stopPropagation());
        sel.addEventListener('change', e => {
          const deal = state.data.deals.find(d => d.id === sel.dataset.moveStage);
          if (deal) {
            deal.stage = e.target.value;
            if (deal.stage === 'Lost') deal.status = 'Lost';
            else if (deal.stage === 'Win') deal.status = 'Won';
            saveState(); showToast(`Stage updated: ${deal.client} → ${deal.stage}`, 'emerald'); render();
          }
        });
      });

    // Salesforce-Style Opportunity Record Modal with Interactive Sales Path
    function openDealModal(dealId = null, prefill = {}) {
      const existing = dealId ? state.data.deals.find(d => d.id === dealId) : null;
      const d = existing || {
        id: 'DL-' + String(Date.now()).slice(-5),
        source: 'Offer Status', date: TODAY_STR, refNo: '',
        client: prefill.client || '', contact: prefill.contact || '', project: prefill.project || '',
        category: 'Supply & Installation', product: 'GRC panel', revision: 'R0',
        rate: '', qty: '', amount: 0, currency: 'INR',
        status: 'In Discussion', stage: 'Need Analysis', owner: 'Pranaychand Das',
        remarks: '', quotationFile: '', followUp: ''
      };
      const owners = [...new Set([...DEAL_OWNERS, d.owner].filter(Boolean))];
      const linkedVisits = existing ? state.data.activities.filter(a => a.client && d.client && a.client.toLowerCase().includes(d.client.toLowerCase().split(' ')[0])) : [];

      openModal('Opportunity · Salesforce Sales Path', existing ? `${d.client} — ${d.project || 'Proposal'}` : 'New Opportunity', `
        <div class="space-y-4">
          <!-- Interactive Salesforce Sales Path -->
          <div>
            <div class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Click Stage to Update Sales Path</div>
            <div class="grid grid-cols-3 sm:grid-cols-6 gap-1.5" id="salesPathBar">
              ${STAGES.map(st => `
                <button type="button" data-path-stage="${esc(st.key)}" class="path-pill px-2 py-2 rounded-lg text-[11px] font-bold border text-center transition-all ${d.stage === st.key ? 'bg-[#0176d3] text-white border-[#0176d3] shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-sky-50 hover:border-sky-300'}">${esc(st.short)}</button>
              `).join('')}
            </div>
          </div>

          <form id="dealForm" class="space-y-4">
            <input type="hidden" name="stage" id="dealStageHidden" value="${esc(d.stage)}" />
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Account / Client *</label><input name="client" required value="${esc(d.client)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Project / Site Location *</label><input name="project" required value="${esc(d.project)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Contact Person &amp; Details</label><input name="contact" value="${esc(d.contact)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:border-[#0176d3]" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Pipeline</label>
                <select name="source" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                  <option value="Offer Status" ${d.source === 'Offer Status' ? 'selected' : ''}>Offer Status (Pranay)</option>
                  <option value="Leadership Pipeline (Ram Sir)" ${d.source === 'Leadership Pipeline (Ram Sir)' ? 'selected' : ''}>Leadership Pipeline (Ram Sir)</option>
                </select>
              </div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Quotation Ref No.</label><input name="refNo" value="${esc(d.refNo)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Offer Date</label><input name="date" type="date" value="${esc(d.date)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Product</label><input name="product" value="${esc(d.product)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Scope / Category</label><input name="category" value="${esc(d.category)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Rate (₹)</label><input name="rate" id="dealRateInput" type="number" step="any" value="${d.rate ?? ''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Quantity</label><input name="qty" id="dealQtyInput" type="number" step="any" value="${d.qty ?? ''}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Proposal Amount (₹ INR)</label><input name="amount" id="dealAmountInput" type="number" step="any" value="${d.amount || 0}" class="w-full px-3 py-2 text-sm font-bold text-[#0176d3] border border-slate-300 rounded-lg" /></div>
              <div><label class="block text-xs font-semibold text-slate-700 mb-1">Opportunity Owner</label>
                <select name="owner" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">
                  ${owners.map(o => `<option value="${esc(o)}" ${d.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
                </select>
              </div>
            </div>

            <div><label class="block text-xs font-semibold text-slate-700 mb-1">Next Follow-up Action</label><input name="followUp" value="${esc(d.followUp)}" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg" /></div>
            <div><label class="block text-xs font-semibold text-slate-700 mb-1">Detailed Remarks</label><textarea name="remarks" rows="2" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg">${esc(d.remarks)}</textarea>
              ${d.quotationFile ? `<div class="mt-1 text-xs text-slate-500">Attached PDF Ref: <span class="font-mono text-slate-700">${esc(d.quotationFile)}</span></div>` : ''}

            ${existing ? `
              <div class="bg-slate-50 rounded-xl border border-slate-200 p-3 flex flex-wrap items-center justify-between gap-2">
                <div class="text-xs text-slate-600"><span class="font-bold text-slate-800">${linkedVisits.length}</span> calendar visit(s) linked to ${esc(d.client)}</div>

              </div>
            ` : ''}

            <div class="pt-3 border-t border-slate-200 flex items-center justify-between gap-2">

                <button type="button" id="cancelDealBtn" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-lg text-sm font-semibold bg-[#0176d3] hover:bg-[#0161b0] text-white shadow-sm">${existing ? 'Save Opportunity' : 'Create Opportunity'}</button>
              </div>
            </div>
          </form>
        </div>
      `);

      // Sales path interactive selection
      document.querySelectorAll('.path-pill').forEach(pill => {
        pill.addEventListener('click', () => {
          const st = pill.dataset.pathStage;
          document.getElementById('dealStageHidden').value = st;
          document.querySelectorAll('.path-pill').forEach(p => {
            const active = p.dataset.pathStage === st;
            p.className = `path-pill px-2 py-2 rounded-lg text-[11px] font-bold border text-center transition-all ${active ? 'bg-[#0176d3] text-white border-[#0176d3] shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-sky-50 hover:border-sky-300'}`;
          });
        });
      });

      const rateEl = document.getElementById('dealRateInput');
      const qtyEl = document.getElementById('dealQtyInput');
      const amtEl = document.getElementById('dealAmountInput');
      const recalc = () => {
        const r = parseFloat(rateEl.value), q = parseFloat(qtyEl.value);
        if (!isNaN(r) && !isNaN(q) && r > 0 && q > 0) amtEl.value = Math.round(r * q);
      };
      rateEl.addEventListener('input', recalc);
      qtyEl.addEventListener('input', recalc);
      document.getElementById('cancelDealBtn').addEventListener('click', closeModal);

      if (existing) {
        document.getElementById('modalFixVisitForDeal').addEventListener('click', () => {
          closeModal();
          openVisitModal(null, { client: d.client, projectInfo: d.project, agenda: `Discussion on ${d.product || 'Proposal'}` });
        });
        document.getElementById('deleteDealBtn').addEventListener('click', () => {
          state.data.deals = state.data.deals.filter(x => x.id !== existing.id);
          saveState(); closeModal(); showToast('Opportunity deleted', 'rose'); render();
        });
      }

      document.getElementById('dealForm').addEventListener('submit', e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const st = fd.get('stage');
        const updated = {
          ...d,
          client: fd.get('client').trim(),
          project: fd.get('project').trim(),
          contact: fd.get('contact').trim(),
          source: fd.get('source'),
          refNo: fd.get('refNo').trim(),
          date: fd.get('date'),
          product: fd.get('product').trim(),
          category: fd.get('category').trim(),
          rate: fd.get('rate') ? Number(fd.get('rate')) : null,
          qty: fd.get('qty') ? Number(fd.get('qty')) : null,
          amount: Number(fd.get('amount')) || 0,
          owner: fd.get('owner'),
          stage: st,
          status: st === 'Lost' ? 'Lost' : (st === 'Win' ? 'Won' : d.status),
          followUp: fd.get('followUp').trim(),
          remarks: fd.get('remarks').trim()
        };
        if (existing) {
          state.data.deals[state.data.deals.findIndex(x => x.id === existing.id)] = updated;
          showToast('Opportunity saved', 'emerald');
        } else {
          state.data.deals.unshift(updated);
          showToast('New opportunity created', 'emerald');
        }
        saveState(); closeModal(); render();
      });
    }

    // ==================== EXPORT & DATA SETTINGS ====================
    function downloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    }

    function toCsv(rows, cols) {
      const escCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
      return [cols.map(escCell).join(','), ...rows.map(r => cols.map(c => escCell(r[c])).join(','))].join('\n');
    }

    function exportCurrentCsv() {
      if (state.view === 'calendar') downloadFile('TGE_Visit_Calendar.csv', toCsv(state.data.activities, ['date','day','timeSlot','visitType','visitStatus','client','projectInfo','agenda','remarks']), 'text/csv;charset=utf-8;');
      else if (state.view === 'accounts') downloadFile('TGE_Developers_Accounts.csv', toCsv(state.data.developers, ['rank','name','state','hq','specialization','tier','status','priority','flagship']), 'text/csv;charset=utf-8;');
      else if (state.view === 'contacts') downloadFile('TGE_Contacts_Outreach.csv', toCsv(state.data.linkedin, ['name','company','designation','phone','email','linkedinUrl','date','status','notes']), 'text/csv;charset=utf-8;');
      else if (state.view === 'ramsir') downloadFile('TGE_Ram_Sir_Reference.csv', toCsv(state.data.ramSirInfo || [], ['refNo','project','owner','status','displayValue','remarks']), 'text/csv;charset=utf-8;');
      else downloadFile('TGE_Opportunities_Pipeline.csv', toCsv(state.data.deals, ['id','source','date','refNo','client','contact','project','category','product','amount','stage','status','owner','followUp','remarks']), 'text/csv;charset=utf-8;');
      showToast('CSV exported', 'emerald');
    }

    function exportLiveHtmlSnapshot() {
      try {
        const clone = document.documentElement.cloneNode(true);
        const appMain = clone.querySelector('#appMain');
        if (appMain) appMain.innerHTML = '';
        const modalBody = clone.querySelector('#modalBody');
        if (modalBody) modalBody.innerHTML = '';
        const modalOv = clone.querySelector('#modalOverlay');
        if (modalOv) { modalOv.classList.add('hidden'); modalOv.classList.remove('flex'); }
        const toastC = clone.querySelector('#toastContainer');
        if (toastC) toastC.innerHTML = '';
        const scripts = clone.querySelectorAll('script');
        let replaced = false;
        const safeJson = JSON.stringify(state.data).replace(/<\//g, '<\\/');
        scripts.forEach(sc => {
          if (sc.textContent && sc.textContent.includes('__CRM_DATA_START__')) {
            sc.textContent = sc.textContent.replace(
              /\/\*__CRM_DATA_START__\*\/[\s\S]*?\/\*__CRM_DATA_END__\*\//,
              '/*__CRM_DATA_START__*/' + safeJson + '/*__CRM_DATA_END__*/'
            );
            replaced = true;
          }
        });
        if (!replaced) { showToast('Snapshot marker not found', 'rose'); return; }
        const dt = new Date().toISOString().slice(0, 10);
        downloadFile(`The_Global_Elephant_CRM_${dt}.html`, '<!DOCTYPE html>\n' + clone.outerHTML, 'text/html;charset=utf-8;');
        showToast('Live CRM (.html) downloaded — ready to attach to any email!', 'emerald');
      } catch (err) {
        showToast('Could not generate CRM snapshot', 'rose');
      }
    }

    function exportVisitsIcs(visits, filename = 'TGE_Visit_Schedule.ics') {
      const cleanIcs = s => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
      const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//The Global Elephant//Sales Cloud CRM//EN', 'CALSCALE:GREGORIAN'];
      visits.filter(v => v.date && /^\d{4}-\d{2}-\d{2}$/.test(v.date)).forEach(v => {
        const ymd = v.date.replace(/-/g, '');
        const hm = (v.timeSlot || '11:00').replace(':', '').padEnd(4, '0');
        const startH = parseInt(hm.slice(0, 2), 10) || 11;
        const endH = String(Math.min(startH + 1, 23)).padStart(2, '0') + hm.slice(2, 4);
        lines.push('BEGIN:VEVENT');
        lines.push(`UID:${v.id}@theglobalelephant.com`);
        lines.push(`DTSTART:${ymd}T${hm}00`);
        lines.push(`DTEND:${ymd}T${endH}00`);
        lines.push(`SUMMARY:${cleanIcs((v.visitType || 'Visit') + ': ' + (v.client || 'Client'))}`);
        lines.push(`LOCATION:${cleanIcs(v.projectInfo || v.locationType || 'Mumbai')}`);
        lines.push(`DESCRIPTION:${cleanIcs([v.agenda ? 'Agenda: ' + v.agenda : '', v.remarks ? 'Remarks: ' + v.remarks : '', 'Status: ' + (v.visitStatus || 'Planned')].filter(Boolean).join(' | '))}`);
        lines.push('END:VEVENT');
      });
      lines.push('END:VCALENDAR');
      downloadFile(filename, lines.join('\r\n'), 'text/calendar;charset=utf-8;');
      showToast(`Exported ${visits.length} visit(s) to .ics for Outlook/Google Calendar`, 'emerald');
    }

    function buildEmailSummaryText(scopeKey, customNote) {
      const deals = state.data.deals;
      const totalVal = deals.reduce((s, d) => s + (Number(d.amount) || 0), 0);
      const openDeals = deals.filter(d => d.stage !== 'Lost' && d.stage !== 'Win');
      const openVal = openDeals.reduce((s, d) => s + (Number(d.amount) || 0), 0);
      const weightedVal = deals.reduce((s, d) => s + (Number(d.amount) || 0) * getStageMeta(d.stage).prob, 0);
      const topDeals = [...openDeals].sort((a, b) => (b.amount || 0) - (a.amount || 0)).slice(0, 6);
      const upcoming = state.data.activities.filter(a => !a.done && (a.date || '') >= TODAY_STR).sort((a, b) => (a.date || '').localeCompare(b.date || '')).slice(0, 6);

      const lines = [
        'Hi,',
        '',
        customNote ? customNote : 'Please find attached the latest interactive CRM file for The Global Elephant (double-click the attached .html file to open the live dashboard, pipeline, and visit calendar in any browser).',
        '',
        `=== PIPELINE SUMMARY (${scopeKey}) ===`,
        `Total Pipeline: ${fmtINR(totalVal)} (${deals.length} opportunities)`,
        `Active Open Pipeline: ${fmtINR(openVal)} (${openDeals.length} active)`,
        `Weighted Forecast (P10-P100): ${fmtINR(weightedVal)}`,
        '',
        '=== TOP ACTIVE OPPORTUNITIES ===',
        ...topDeals.map((d, i) => `${i + 1}. ${d.client} — ${d.project || 'Project'} | ${fmtDealAmount(d)} | Stage: ${d.stage}`),
        '',
        '=== UPCOMING PLANNED VISITS ===',
        ...(upcoming.length ? upcoming.map(v => `- ${v.date} (${v.timeSlot || '11:00'}): ${v.client} — ${v.projectInfo || v.visitType}`) : ['- No upcoming visits scheduled yet.']),
        '',
        'Regards,',
        'Pranaychand Das',
        'The Global Elephant'
      ];
      return lines.join('\n');
    }
